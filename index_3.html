<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語音佛典 · Voidflower 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:     #0D1B2A;
  --gold:    #C9A84C;
  --gold-lt: #E8C97A;
  --gold-dk: #8A6B20;
  --paper:   #F5EDD6;
  --vermil:  #8B2E16;
}

html { scroll-behavior: smooth; }
body {
  background: var(--ink);
  color: var(--paper);
  font-family: 'Noto Serif TC', serif;
  min-height: 100vh;
  overflow-x: hidden;
}

#bg-canvas {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; opacity: 0.15;
}

/* ── VIEWS ── */
.view { display: none; position: relative; z-index: 1; }
.view.active { display: block; }

/* ══════════════════════════════
   HOME VIEW
══════════════════════════════ */
#view-home { padding-bottom: 80px; }

.home-header {
  text-align: center;
  padding: 56px 24px 36px;
}
.eyebrow {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 10px; letter-spacing: 0.4em;
  color: var(--gold); opacity: 0.8;
  margin-bottom: 18px;
}
.mandala {
  width: 72px; height: 72px;
  margin: 0 auto 18px;
}
.mandala svg { width: 100%; height: 100%; animation: spin 32s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.site-title {
  font-size: clamp(20px, 5vw, 26px);
  font-weight: 700; letter-spacing: 0.12em;
  color: var(--paper); text-shadow: 0 0 40px var(--gold-dk);
  line-height: 1.6;
}
.site-sub {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 12px; letter-spacing: 0.2em;
  color: var(--gold-lt); opacity: 0.7;
  margin-top: 8px;
}
.hline {
  width: 100px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 20px auto 0;
}

/* Search + filter bar */
.toolbar {
  max-width: 900px; margin: 0 auto;
  padding: 0 20px 24px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.search-wrap {
  flex: 1; min-width: 180px;
  position: relative;
}
.search-wrap input {
  width: 100%;
  background: rgba(201,168,76,0.06);
  border: 1px solid rgba(201,168,76,0.22);
  border-radius: 3px;
  color: var(--paper);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 13px;
  padding: 9px 14px 9px 36px;
  outline: none;
  transition: border-color 0.2s;
}
.search-wrap input::placeholder { color: rgba(245,237,214,0.3); }
.search-wrap input:focus { border-color: var(--gold); }
.search-icon {
  position: absolute; left: 11px; top: 50%;
  transform: translateY(-50%);
  color: var(--gold-lt); opacity: 0.5; font-size: 14px;
  pointer-events: none;
}
.filter-btn {
  background: rgba(201,168,76,0.06);
  border: 1px solid rgba(201,168,76,0.22);
  border-radius: 3px;
  color: var(--gold-lt);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 11px; letter-spacing: 0.1em;
  padding: 8px 14px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  white-space: nowrap;
}
.filter-btn:hover, .filter-btn.on {
  border-color: var(--gold); background: rgba(201,168,76,0.14);
  color: var(--gold);
}
.count-label {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 10px; letter-spacing: 0.2em;
  color: var(--gold); opacity: 0.6;
  margin-left: auto; white-space: nowrap;
}

/* Card grid */
.card-grid {
  max-width: 900px; margin: 0 auto;
  padding: 0 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
}

.sutra-card {
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 4px;
  padding: 20px 18px 16px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s, transform 0.15s;
  background: rgba(201,168,76,0.03);
  position: relative;
  overflow: hidden;
}
.sutra-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--vermil), var(--gold));
  opacity: 0;
  transition: opacity 0.2s;
}
.sutra-card:hover {
  border-color: rgba(201,168,76,0.55);
  background: rgba(201,168,76,0.08);
  transform: translateY(-2px);
}
.sutra-card:hover::before { opacity: 1; }

/* empty / coming soon card */
.sutra-card.empty {
  cursor: default;
  border-style: dashed;
  opacity: 0.35;
}
.sutra-card.empty:hover { transform: none; background: rgba(201,168,76,0.03); border-color: rgba(201,168,76,0.2); }
.sutra-card.empty::before { display: none; }

.card-num {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 9px; letter-spacing: 0.35em;
  color: var(--gold); opacity: 0.65;
  margin-bottom: 8px;
}
.card-title {
  font-size: 15px; font-weight: 500;
  letter-spacing: 0.07em; line-height: 1.55;
  color: var(--paper);
}
.card-sub {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 11px; color: var(--gold-lt);
  opacity: 0.6; margin-top: 4px;
  letter-spacing: 0.05em;
}
.card-meta {
  display: flex; align-items: center; gap: 8px;
  margin-top: 14px;
}
.tag {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 9px; letter-spacing: 0.15em;
  padding: 3px 7px; border-radius: 2px;
  border: 1px solid rgba(201,168,76,0.25);
  color: var(--gold-lt); opacity: 0.7;
}
.play-hint {
  margin-left: auto;
  font-size: 16px; color: var(--gold);
  opacity: 0; transition: opacity 0.2s;
}
.sutra-card:hover .play-hint { opacity: 0.8; }

/* ══════════════════════════════
   PLAYER VIEW
══════════════════════════════ */
#view-player {
  max-width: 760px; margin: 0 auto;
  padding: 0 24px 80px;
}

.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 11px; letter-spacing: 0.2em;
  color: var(--gold-lt); opacity: 0.6;
  cursor: pointer; border: none; background: none;
  padding: 0; margin: 30px 0 28px;
  transition: opacity 0.2s;
}
.back-btn:hover { opacity: 1; }

.player-header { text-align: center; padding-bottom: 36px; }
.player-eyebrow {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 10px; letter-spacing: 0.4em;
  color: var(--gold); opacity: 0.75; margin-bottom: 14px;
}
.player-title-main {
  font-size: clamp(20px, 4.5vw, 27px);
  font-weight: 700; letter-spacing: 0.1em; line-height: 1.5;
  text-shadow: 0 0 30px var(--gold-dk);
}
.player-title-vol {
  font-size: 14px; font-weight: 300;
  color: var(--gold-lt); letter-spacing: 0.15em; margin-top: 6px;
}
.p-hline {
  width: 80px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 18px auto 0;
}

/* Player card */
.player-card {
  background: linear-gradient(135deg, rgba(201,168,76,0.07), rgba(13,27,42,0.8));
  border: 1px solid rgba(201,168,76,0.28);
  border-radius: 4px;
  padding: 32px 28px 24px;
  margin-bottom: 28px;
  position: relative; overflow: hidden;
}
.player-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--vermil), var(--gold), var(--vermil));
}

.audio-ctrl { display: flex; flex-direction: column; gap: 14px; }

.prog-row { display: flex; align-items: center; gap: 10px; }
.t-lbl {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 11px; color: var(--gold-lt); opacity: 0.8;
  min-width: 36px;
}
.t-lbl.right { text-align: right; }

.prog-wrap {
  flex: 1; height: 3px;
  background: rgba(201,168,76,0.18); border-radius: 2px;
  cursor: pointer; position: relative;
  transition: height 0.15s;
}
.prog-wrap:hover { height: 5px; }
.prog-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--gold-dk), var(--gold-lt));
  border-radius: 2px; pointer-events: none;
  transition: width 0.1s linear;
}
.prog-thumb {
  position: absolute; top: 50%; left: 0%;
  transform: translate(-50%, -50%);
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--gold); pointer-events: none;
  opacity: 0; transition: opacity 0.2s;
}
.prog-wrap:hover .prog-thumb { opacity: 1; }

.btn-row { display: flex; align-items: center; gap: 10px; }
.btn-play {
  width: 48px; height: 48px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-dk), var(--gold));
  border: none; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 20px rgba(201,168,76,0.3);
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-play:hover { transform: scale(1.07); box-shadow: 0 0 32px rgba(201,168,76,0.5); }
.btn-play svg { fill: var(--ink); width: 18px; height: 18px; }

.btn-skip {
  background: none;
  border: 1px solid rgba(201,168,76,0.25); border-radius: 3px;
  color: var(--gold-lt);
  font-family: 'Noto Sans TC', sans-serif; font-size: 11px;
  padding: 5px 10px; cursor: pointer; letter-spacing: 0.05em;
  transition: border-color 0.2s, color 0.2s;
}
.btn-skip:hover { border-color: var(--gold); color: var(--gold); }

.vol-row { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.vol-icon { color: var(--gold-lt); font-size: 12px; opacity: 0.6; }
input[type=range].vol-slider {
  -webkit-appearance: none; width: 72px; height: 2px;
  background: rgba(201,168,76,0.25); border-radius: 2px; outline: none; cursor: pointer;
}
input[type=range].vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 10px; height: 10px;
  border-radius: 50%; background: var(--gold); cursor: pointer;
}
.speed-sel {
  background: transparent;
  border: 1px solid rgba(201,168,76,0.25); border-radius: 3px;
  color: var(--gold-lt);
  font-family: 'Noto Sans TC', sans-serif; font-size: 11px;
  padding: 3px 6px; cursor: pointer; outline: none;
}
.speed-sel option { background: var(--ink); color: var(--paper); }

/* Drive embed */
.embed-label {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 10px; letter-spacing: 0.35em;
  color: var(--gold); opacity: 0.6; margin-bottom: 10px;
}
.drive-embed {
  border: 1px solid rgba(201,168,76,0.15);
  border-radius: 3px; overflow: hidden;
  background: rgba(0,0,0,0.3);
}
.drive-embed iframe { width: 100%; border: none; display: block; }

/* Resource cards */
.res-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px;
}
@media(max-width:480px){ .res-grid { grid-template-columns: 1fr; } }
.res-card {
  border: 1px solid rgba(201,168,76,0.2); border-radius: 3px;
  padding: 16px 14px; text-decoration: none;
  display: flex; flex-direction: column; gap: 5px;
  background: rgba(201,168,76,0.03);
  transition: border-color 0.2s, background 0.2s;
}
.res-card:hover { border-color: var(--gold); background: rgba(201,168,76,0.09); }
.res-card .rt { font-family:'Noto Sans TC',sans-serif; font-size:9px; letter-spacing:.35em; color:var(--gold); opacity:.7; }
.res-card .rn { font-size:13px; color:var(--paper); letter-spacing:.05em; line-height:1.5; }
.res-card .ra { font-size:11px; color:var(--gold-lt); opacity:.55; margin-top:4px; }

/* Sec divider */
.sec-div {
  display: flex; align-items: center; gap: 12px; margin: 28px 0 14px;
}
.sec-div::before,.sec-div::after {
  content:''; flex:1; height:1px;
  background: linear-gradient(90deg,transparent,rgba(201,168,76,0.25));
}
.sec-div::after { background: linear-gradient(90deg,rgba(201,168,76,0.25),transparent); }
.sec-div span {
  font-family:'Noto Sans TC',sans-serif; font-size:9px;
  letter-spacing:.35em; color:var(--gold); opacity:.7; white-space:nowrap;
}

/* Footer */
footer {
  text-align: center; padding: 40px 0 20px;
  border-top: 1px solid rgba(201,168,76,0.1);
  margin-top: 20px;
}
footer p {
  font-family:'Noto Sans TC',sans-serif; font-size:10px;
  letter-spacing:.3em; color:rgba(245,237,214,0.28); line-height:2;
}

@media (max-width:520px) {
  .card-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width:360px) {
  .card-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .mandala svg { animation: none; }
  .sutra-card { transition: none; }
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- ══ HOME VIEW ══ -->
<div id="view-home" class="view active">

  <div class="home-header">
    <div class="eyebrow">語音佛典 · Voidflower 2026</div>
    <div class="mandala">
      <svg viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
        <circle cx="36" cy="36" r="33" fill="none" stroke="#C9A84C" stroke-width="0.5" stroke-dasharray="3 3"/>
        <circle cx="36" cy="36" r="25" fill="none" stroke="#C9A84C" stroke-width="0.4" stroke-dasharray="2 4"/>
        <g fill="none" stroke="#C9A84C" stroke-width="0.65" opacity="0.75">
          <ellipse cx="36" cy="20" rx="4.5" ry="9" transform="rotate(0 36 36)"/>
          <ellipse cx="36" cy="20" rx="4.5" ry="9" transform="rotate(45 36 36)"/>
          <ellipse cx="36" cy="20" rx="4.5" ry="9" transform="rotate(90 36 36)"/>
          <ellipse cx="36" cy="20" rx="4.5" ry="9" transform="rotate(135 36 36)"/>
          <ellipse cx="36" cy="20" rx="4.5" ry="9" transform="rotate(180 36 36)"/>
          <ellipse cx="36" cy="20" rx="4.5" ry="9" transform="rotate(225 36 36)"/>
          <ellipse cx="36" cy="20" rx="4.5" ry="9" transform="rotate(270 36 36)"/>
          <ellipse cx="36" cy="20" rx="4.5" ry="9" transform="rotate(315 36 36)"/>
        </g>
        <circle cx="36" cy="36" r="4" fill="none" stroke="#C9A84C" stroke-width="0.7"/>
        <circle cx="36" cy="36" r="1.5" fill="#C9A84C" opacity="0.6"/>
      </svg>
    </div>
    <div class="site-title">語音佛典</div>
    <div class="site-sub">voidflower2026.github.io</div>
    <div class="hline"></div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">&#9740;</span>
      <input type="text" id="search-inp" placeholder="搜尋經文名稱…" autocomplete="off">
    </div>
    <button class="filter-btn on" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="available">已上架</button>
    <button class="filter-btn" data-filter="coming">即將上架</button>
    <span class="count-label" id="count-lbl">共 0 部</span>
  </div>

  <div class="card-grid" id="card-grid"></div>

  <footer>
    <p>語音佛典 · Voidflower 2026</p>
    <p style="margin-top:8px; font-size:9px; opacity:0.35; letter-spacing:0.5em;">願以此功德　迴向一切眾生</p>
  </footer>
</div>

<!-- ══ PLAYER VIEW ══ -->
<div id="view-player" class="view">
  <button class="back-btn" id="back-btn">← 返回經文列表</button>

  <div class="player-header">
    <div class="player-eyebrow">語音播放</div>
    <div class="player-title-main" id="p-title">－</div>
    <div class="player-title-vol" id="p-vol"></div>
    <div class="p-hline"></div>
  </div>

  <div class="player-card">
    <audio id="native-audio" preload="auto"></audio>
    <div class="audio-ctrl">
      <div class="prog-row">
        <span class="t-lbl" id="t-cur">0:00</span>
        <div class="prog-wrap" id="prog-wrap">
          <div class="prog-fill" id="prog-fill"></div>
          <div class="prog-thumb" id="prog-thumb"></div>

      </div>
      <div class="btn-row">
        <button class="btn-play" id="btn-play">
          <svg id="play-ico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn-skip" id="btn-back">← 15秒</button>
        <button class="btn-skip" id="btn-fwd">15秒 →</button>
        <div class="vol-row">
          <span class="vol-icon">♪</span>
          <input type="range" class="vol-slider" id="vol-sl" min="0" max="1" step="0.05" value="1">
          <select class="speed-sel" id="speed-sel">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="sec-div"><span>雲端備用播放</span></div>
  <div class="embed-label">若上方無法播放，請使用備用播放器</div>
  <div class="drive-embed">
    <iframe id="drive-iframe" src="" height="80" allow="autoplay" loading="lazy"></iframe>
  </div>

  <div class="res-grid">
    <a class="res-card" id="res-doc" href="#" target="_blank" rel="noopener">
      <span class="rt">文字版 · Google Doc</span>
      <span class="rn" id="res-doc-name">－</span>
      <span class="ra">開啟文件 →</span>
    </a>
    <a class="res-card" id="res-audio" href="#" target="_blank" rel="noopener">
      <span class="rt">音頻檔案 · Google Drive</span>
      <span class="rn" id="res-audio-name">語音誦讀</span>
      <span class="ra">前往雲端 →</span>
    </a>
  </div>

  <footer>
    <p>語音佛典 · Voidflower 2026</p>
    <p style="margin-top:8px;font-size:9px;opacity:.3;letter-spacing:.5em;">願以此功德　迴向一切眾生</p>
  </footer>
</div>

<script>
/* ══════════════════════
   SUTRA DATA
   新增經文：在 SUTRAS 陣列加一個物件即可
   fileId: Google Drive 檔案 ID
   docUrl: Google Doc 連結（無文字版可填 null）
   vol: 卷別（選填）
   date: 錄製日期（選填）
   available: true = 已上架，false = 即將上架
══════════════════════ */
const SUTRAS = [
  {
    id: 1,
    title: '最上乘論',
    vol: '',
    date: '2026 · 03',
    fileId: '1VtXKrWZdgUP9jMEUQj17ekHxYqqOjMH5',
    docUrl: 'https://docs.google.com/document/d/1xyEW84N01os0zp1lOn7Lx0a30VWCHJ0_/edit',
    available: true
  },
  /* ── 請依以下格式繼續新增 ──
  {
    id: 2,
    title: '（經文名稱）',
    vol: '（卷別，如：卷上）',
    date: '2026 · 03',
    fileId: '（Google Drive 檔案ID）',
    docUrl: '（Google Doc 網址，無則填 null）',
    available: true
  },
  ── */
  // 以下為佔位卡片（available: false），可自行替換
  { id: 2,  title: '（經文 2）',  vol: '', date: '', fileId: '', docUrl: null, available: false },
  { id: 3,  title: '（經文 3）',  vol: '', date: '', fileId: '', docUrl: null, available: false },
  { id: 4,  title: '（經文 4）',  vol: '', date: '', fileId: '', docUrl: null, available: false },
  { id: 5,  title: '（經文 5）',  vol: '', date: '', fileId: '', docUrl: null, available: false },
  { id: 6,  title: '（經文 6）',  vol: '', date: '', fileId: '', docUrl: null, available: false },
];

/* ══ Render cards ══ */
const grid = document.getElementById('card-grid');
const countLbl = document.getElementById('count-lbl');
let activeFilter = 'all';
let searchQ = '';

function renderCards() {
  let list = SUTRAS.filter(s => {
    const matchF = activeFilter === 'all' ||
                   (activeFilter === 'available' && s.available) ||
                   (activeFilter === 'coming' && !s.available);
    const matchS = searchQ === '' ||
                   s.title.includes(searchQ) || (s.vol||'').includes(searchQ);
    return matchF && matchS;
  });

  countLbl.textContent = `共 ${list.length} 部`;
  grid.innerHTML = '';

  list.forEach(s => {
    const card = document.createElement('div');
    card.className = 'sutra-card' + (s.available ? '' : ' empty');
    card.innerHTML = `
      <div class="card-num">No. ${String(s.id).padStart(2,'0')}</div>
      <div class="card-title">${s.title}</div>
      ${s.vol ? `<div class="card-sub">${s.vol}</div>` : ''}
      <div class="card-meta">
        ${s.date ? `<span class="tag">${s.date}</span>` : ''}
        ${s.available ? '<span class="tag">已上架</span>' : '<span class="tag" style="opacity:.4">即將上架</span>'}
        ${s.available ? '<span class="play-hint">▶</span>' : ''}
      </div>`;
    if (s.available) {
      card.addEventListener('click', () => openPlayer(s));
    }
    grid.appendChild(card);
  });
}

/* ══ View switching ══ */
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));

  showView('view-home');
});

/* ══ Player ══ */
const audio    = document.getElementById('native-audio');
const btnPlay  = document.getElementById('btn-play');
const playIco  = document.getElementById('play-ico');
const progWrap = document.getElementById('prog-wrap');
const progFill = document.getElementById('prog-fill');
const progThumb= document.getElementById('prog-thumb');
const tCur     = document.getElementById('t-cur');
const tDur     = document.getElementById('t-dur');
const volSl    = document.getElementById('vol-sl');
const speedSel = document.getElementById('speed-sel');
const btnBack  = document.getElementById('btn-back');
const btnFwd   = document.getElementById('btn-fwd');
const iframe   = document.getElementById('drive-iframe');
const PLAY_SVG = '<path d="M8 5v14l11-7z"/>';
const PAUSE_SVG= '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

function fmt(s) {
  if (!isFinite(s)) return '--:--';
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}

audio.addEventListener('loadedmetadata', () => { tDur.textContent = fmt(audio.duration); });
audio.addEventListener('timeupdate', () => {
  const p = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  progFill.style.width = p + '%';
  progThumb.style.left = p + '%';
  tCur.textContent = fmt(audio.currentTime);
});
audio.addEventListener('ended', () => { playIco.innerHTML = PLAY_SVG; });

btnPlay.addEventListener('click', () => {
  if (audio.paused) { audio.play(); playIco.innerHTML = PAUSE_SVG; }
  else { audio.pause(); playIco.innerHTML = PLAY_SVG; }
});
progWrap.addEventListener('click', e => {
  const r = progWrap.getBoundingClientRect();
  audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
});
volSl.addEventListener('input', () => { audio.volume = volSl.value; });
speedSel.addEventListener('change', () => { audio.playbackRate = parseFloat(speedSel.value); });
btnBack.addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 15); });
btnFwd.addEventListener('click',  () => { audio.currentTime = Math.min(audio.duration||0, audio.currentTime + 15); });

function openPlayer(s) {
  // reset
  audio.pause();
  playIco.innerHTML = PLAY_SVG;
  tCur.textContent = '0:00'; tDur.textContent = '--:--';
  progFill.style.width = '0%'; progThumb.style.left = '0%';

  // set titles
  document.getElementById('p-title').textContent = s.title;
  document.getElementById('p-vol').textContent = [s.vol, s.date].filter(Boolean).join('　');

  // audio src
  audio.src = `https://drive.google.com/uc?export=download&id=${s.fileId}&confirm=t`;
  audio.load();

  // iframe embed
  iframe.src = `https://drive.google.com/file/d/${s.fileId}/preview`;

  // resource links
  const docCard = document.getElementById('res-doc');
  if (s.docUrl) {
    docCard.href = s.docUrl;
    docCard.style.display = '';
    document.getElementById('res-doc-name').textContent = s.title + (s.vol ? '　' + s.vol : '');
  } else {
    docCard.style.display = 'none';
  }
  document.getElementById('res-audio').href =
    `https://drive.google.com/file/d/${s.fileId}/view`;
  document.getElementById('res-audio-name').textContent =
    s.title + (s.vol ? '　' + s.vol : '');

  showView('view-player');
}

/* ══ Lotus canvas ══ */
(function(){
  const cv = document.getElementById('bg-canvas');
  const ctx = cv.getContext('2d');
  let W, H, t = 0;
  function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
  resize(); window.addEventListener('resize', resize);
  function frame(){
    t += 0.003;
    ctx.clearRect(0,0,W,H);
    for(let i=0;i<6;i++){
      const r = 70 + i*65 + Math.sin(t+i)*10;
      ctx.beginPath(); ctx.arc(W/2,H/2,r,0,Math.PI*2);
      ctx.strokeStyle = `rgba(201,168,76,${0.035+0.012*Math.sin(t*1.5+i)})`;
      ctx.lineWidth = 1; ctx.stroke();
    }
    // small lotus centre
    for(let i=0;i<8;i++){
      const a = t*0.3 + i*Math.PI/4;
      ctx.save(); ctx.translate(W/2,H/2); ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(0,-90,14,36,0,0,Math.PI*2);
      ctx.strokeStyle='rgba(201,168,76,0.06)'; ctx.lineWidth=0.8; ctx.stroke();
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ══ Init ══ */
renderCards();
</script>
